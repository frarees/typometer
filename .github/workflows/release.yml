name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - id: version
        name: Read and validate version
        shell: bash
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "value=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Maven version $version." >&2
            exit 1
          fi

      - name: Ensure Pandoc is available
        shell: bash
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes pandoc
          fi

      - name: Build and test
        run: mvn --batch-mode clean package -Pnative

      - name: Prepare Linux, portable, and shared artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p target/release target/release-input
          cp "target/typometer-$version.jar" target/release-input/
          cp target/README.html target/release-input/
          cp LICENSE target/release-input/
          cp target/linux/typometer-*-linux-*.tar.gz target/release/
          cp "target/typometer-$version-bin.zip" target/release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-build-inputs
          path: target/release-input/*
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: typometer-linux-x64-and-portable
          path: target/release/*
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/package-macos.sh
            scripts/package-macos-dmg.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: release-build-inputs
          path: target/release-input

      - name: Create DMG
        shell: bash
        run: |
          version="${{ needs.build.outputs.version }}"
          mkdir -p target/release
          cp "target/release-input/typometer-$version.jar" target/

          scripts/package-macos.sh \
            target \
            "typometer-$version.jar" \
            "$version"

          scripts/package-macos-dmg.sh \
            target/macos/Typometer.app \
            target/release-input/README.html \
            target/release-input/LICENSE \
            "target/release/typometer-$version-macos-${{ matrix.architecture }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: typometer-macos-${{ matrix.architecture }}
          path: target/release/*.dmg
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/package-windows.ps1
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: release-build-inputs
          path: target/release-input

      - name: Create MSI
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          & .\scripts\package-windows.ps1 `
            -JarPath "target/release-input/typometer-$version.jar" `
            -AppVersion "$version" `
            -OutputDirectory target/release `
            -ReadmePath "target/release-input/README.html" `
            -LicensePath "target/release-input/LICENSE"

      - uses: actions/upload-artifact@v4
        with:
          name: typometer-windows-x64
          path: target/release/*.msi
          if-no-files-found: error
          compression-level: 0

  publish:
    needs:
      - build
      - macos
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: typometer-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum typometer-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: typometer-${{ needs.build.outputs.version }}-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
